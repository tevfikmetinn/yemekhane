name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "images/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r data _site/data
          cp -r images _site/images
          # Lokal "../data" / "../images" yollarını deploy için "./..." yap.
          # Tüm JS dosyalarına uygula (app.js, admin.js).
          for f in _site/*.js; do
            [ -f "$f" ] || continue
            sed -i 's|\.\./data|./data|g; s|\.\./images|./images|g' "$f"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
